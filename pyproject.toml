[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dndwright"
version = "0.28.0"
description = "Domain-neutral D&D 5e (2024) rules & character-sheet computation engine: a data-driven DAG of formulas (ability mods, proficiency, spell DC/slots, HP, AC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Sligar" }]
keywords = ["dnd", "dnd5e", "ttrpg", "rules-engine", "character-sheet", "srd", "computation-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
# ruff is bounded on BOTH sides on purpose. CI installs this extra fresh on every
# run, so an open-ended floor means the lint gate silently adopts whatever ruff
# shipped that morning — which is exactly how main went red: 0.16.0 widened the
# DEFAULT rule set (I/RUF/SIM/PL/UP) and 40 pre-existing findings appeared in
# files nobody had touched. The floor is 0.5 because the rule set below uses the
# `[tool.ruff.lint]` table; the ceiling keeps a new minor from moving the gate again.
# tomli is the 3.10 backport of stdlib tomllib (3.11+). tests/test_packaging_contract.py
# reads pyproject.toml to assert the dependency and lint-gate rules; without this the
# check would have to skip on 3.10 — the LOWEST version we claim to support, and so the
# one where an unguarded gate matters most. A check that cannot fail on a supported
# interpreter is not a gate.
dev = ["pytest>=7.4", "ruff>=0.5,<0.17", "hypothesis>=6.0", "tomli>=2.0; python_version<'3.11'"]

[project.scripts]
dndwright = "dndwright.cli:main"

[project.urls]
Homepage = "https://github.com/sligara7/dndwright"
Repository = "https://github.com/sligara7/dndwright"
Changelog = "https://github.com/sligara7/dndwright/blob/main/CHANGELOG.md"
Issues = "https://github.com/sligara7/dndwright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dndwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# State the enforced rule set EXPLICITLY rather than inheriting ruff's defaults.
# Inheriting means the gate's meaning is a property of whichever ruff CI happened
# to install, so a release that widens the defaults retroactively fails commits
# that were green when written — with findings in files the change never touched.
# These four are what this project has actually been enforcing (ruff's historical
# default): pyflakes plus the pycodestyle errors that catch real mistakes.
# The wider families were adopted DELIBERATELY on 2026-08-15, in their own commit,
# which is the order this rule demands. `PL` is not adopted: 262 findings, nearly all
# magic-value comparison in rules tables where the constants ARE the ruleset.
select = ["E4", "E7", "E9", "F", "I", "SIM", "UP", "RUF"]

ignore = [
    # Ambiguous-unicode in docstrings/comments. This project's prose uses en/em
    # dashes and arrows on purpose; flagging them fights the house style rather
    # than catching a defect.
    "RUF001", "RUF002", "RUF003",
    # Cosmetic, and each deserves its own reasoning rather than riding along in a
    # lint sweep: a list concatenation in the compose() hot path, and a mutable
    # class attribute in a test fixture.
    "RUF005", "RUF012",
]

# ⚠️ RUF046 IS DELIBERATELY *NOT* IGNORED HERE, AND THAT IS A LOAD-BEARING DIFFERENCE
# FROM mapwright, WHICH DOES IGNORE IT.
#
# RUF046 rewrites `int(round(x))` -> `round(x)`. That is correct ONLY when `x` is a
# plain Python float: `round(np.float64)` returns a np.float64, NOT an int, so on a
# numpy codebase the rewrite silently changes the TYPE flowing downstream. mapwright
# is numpy-based and declines it for exactly that reason.
#
# dndwright is safe to enable it because this package has NO numpy — which is not an
# accident, it is `rule:dw_dependency_light` ("pydantic and pyyaml plus the standard
# library, and explicitly no NumPy"), asserted by tests/test_packaging_contract.py.
#
# ⇒ THE SAFETY OF THIS LINE DEPENDS ON A DEPENDENCY RULE, AND THAT LINK IS ITSELF
# CHECKED: TestRuf046SafetyIsLinkedToNumpyAbsence fails if numpy is ever added while
# RUF046 is still active, so the two decisions cannot drift apart silently.
