[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dndwright"
version = "0.26.0"
description = "Domain-neutral D&D 5e (2024) rules & character-sheet computation engine: a data-driven DAG of formulas (ability mods, proficiency, spell DC/slots, HP, AC)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthony Sligar" }]
keywords = ["dnd", "dnd5e", "ttrpg", "rules-engine", "character-sheet", "srd", "computation-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
# ruff is bounded on BOTH sides on purpose. CI installs this extra fresh on every
# run, so an open-ended floor means the lint gate silently adopts whatever ruff
# shipped that morning — which is exactly how main went red: 0.16.0 widened the
# DEFAULT rule set (I/RUF/SIM/PL/UP) and 40 pre-existing findings appeared in
# files nobody had touched. The floor is 0.5 because the rule set below uses the
# `[tool.ruff.lint]` table; the ceiling keeps a new minor from moving the gate again.
dev = ["pytest>=7.4", "ruff>=0.5,<0.17", "hypothesis>=6.0"]

[project.scripts]
dndwright = "dndwright.cli:main"

[project.urls]
Homepage = "https://github.com/sligara7/dndwright"
Repository = "https://github.com/sligara7/dndwright"
Changelog = "https://github.com/sligara7/dndwright/blob/main/CHANGELOG.md"
Issues = "https://github.com/sligara7/dndwright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dndwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# State the enforced rule set EXPLICITLY rather than inheriting ruff's defaults.
# Inheriting means the gate's meaning is a property of whichever ruff CI happened
# to install, so a release that widens the defaults retroactively fails commits
# that were green when written — with findings in files the change never touched.
# These four are what this project has actually been enforcing (ruff's historical
# default): pyflakes plus the pycodestyle errors that catch real mistakes.
# Adopting more (import sorting `I`, `RUF`, `SIM`, `UP`) is a deliberate choice to
# make on its own, with the resulting fixes in their own commit — not a side effect
# of a dependency resolving forward.
select = ["E4", "E7", "E9", "F"]
